services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skalet
      POSTGRES_USER: skalet
      POSTGRES_PASSWORD: skalet-local
    ports:
      - "5432:5432"
    volumes:
      - skalet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skalet -d skalet"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  skalet-postgres:
